<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de tareas</title>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <h1>Lista de tareas 🌸</h1>
    <div>
      <h2>Nueva tarea</h2>
      <input type="text" id="nueva-tarea" placeholder="Agregar nueva tarea" />
      <button id="agregar-tarea">Agregar tarea</button>
      <ul id="lista-tareas"></ul>
      <h3>Cantidad de tareas: <span id="cantidad-tareas"></span></h3>
      <h3>Tareas completadas: <span id="cantidad-completadas"></span></h3>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
